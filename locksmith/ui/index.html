<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Locksmith</title>
  <style>
    :root { --bg:#0b1210; --ink:#d7efe4; --line:#1e3a32; --mint:#7ddcb0; --fail:#ff6b8a; --dim:#4a6a60; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--ink); font-family: ui-monospace, monospace; }
    header { padding:16px 20px; border-bottom:1px solid var(--line); display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap; align-items:center; }
    header strong { letter-spacing:.14em; font-size:12px; color:var(--mint); }
    button { background:var(--mint); color:#0b1210; border:0; padding:8px 12px; cursor:pointer; font-family:inherit; }
    .cols { display:grid; grid-template-columns:repeat(4,1fr); gap:12px; padding:16px 20px; }
    .col h2 { margin:0 0 8px; font-size:11px; letter-spacing:.16em; color:var(--dim); }
    .card { border:1px solid var(--dim); padding:10px; margin-bottom:8px; min-height:72px; opacity:.35; transition:opacity .2s, border-color .2s; }
    .card.on { opacity:1; border-color:var(--mint); }
    .card.fail { border-color:var(--fail); }
    .card img { width:100%; height:72px; object-fit:cover; display:block; margin-top:6px; background:#000; }
    .log { padding:0 20px 24px; font-size:12px; color:#9ab8ac; max-height:28vh; overflow:auto; }
    .log div { margin:4px 0; }
    .fail { color:var(--fail); }
    @media (max-width:900px){ .cols { grid-template-columns:1fr 1fr; } }
  </style>
</head>
<body>
  <header>
    <div>
      <strong>LOCKSMITH</strong>
      <div id="sub">art-bible · fail-closed</div>
    </div>
    <button type="button" id="play">Replay DAG</button>
  </header>
  <div class="cols" id="cols"></div>
  <div class="log" id="log"></div>
  <script>
    fetch("../runs/demo.json").then(r => r.json()).then(run => {
      document.getElementById("sub").textContent = run.name + " · " + run.status;
      const cols = document.getElementById("cols");
      const cards = {};
      for (const c of run.columns) {
        const wrap = document.createElement("div");
        wrap.className = "col";
        wrap.innerHTML = "<h2>" + c.title.toUpperCase() + "</h2>";
        const host = document.createElement("div");
        wrap.appendChild(host);
        cols.appendChild(wrap);
        for (const n of run.nodes.filter(x => x.column === c.id)) {
          const el = document.createElement("article");
          el.className = "card";
          el.innerHTML = "<div>" + n.label + "</div><div style='opacity:.7;font-size:11px'>" + (n.detail || "") + "</div>";
          if (n.artifact) {
            const img = document.createElement("img");
            img.src = n.artifact;
            img.alt = n.label;
            el.appendChild(img);
          }
          host.appendChild(el);
          cards[n.id] = el;
        }
      }
      const logEl = document.getElementById("log");
      async function replay() {
        logEl.innerHTML = "";
        Object.values(cards).forEach(el => { el.className = "card"; });
        const events = [...run.nodes].sort((a,b) => a.t_ms - b.t_ms);
        for (const n of events) {
          await new Promise(res => setTimeout(res, 220));
          const el = cards[n.id];
          if (!el) continue;
          el.classList.add("on");
          if (n.status === "fail") el.classList.add("fail");
          const line = document.createElement("div");
          line.className = n.status === "fail" ? "fail" : "";
          line.textContent = (n.t_ms / 1000).toFixed(2) + "s  " + n.label + (n.reason ? " — " + n.reason : "");
          logEl.appendChild(line);
          logEl.scrollTop = logEl.scrollHeight;
        }
      }
      document.getElementById("play").onclick = replay;
      replay();
    }).catch(err => {
      document.getElementById("sub").textContent = "failed to load demo.json";
      console.error(err);
    });
  </script>
</body>
</html>
