<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Twin Orbit</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <p class="kicker">Twin Orbit · two locks</p>
    <h1>Hand the cell across.</h1>

  </header>
  <canvas id="game" width="960" height="540" aria-label="Twin Orbit playfield"></canvas>
  <p class="status" id="status">Get the battery into the socket on the right ledge.</p>
  <aside class="locks">
    <figure><img src="art/pilot.jpg" alt="Pilot canonical lock"><figcaption>Pilot lock</figcaption></figure>
    <figure><img src="art/mechanic.jpg" alt="Mechanic canonical lock"><figcaption>Mechanic lock</figcaption></figure>
  </aside>
  <script src="app.js"></script>
</body>
</html>
