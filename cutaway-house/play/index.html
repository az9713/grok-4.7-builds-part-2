<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Cutaway House</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header>
    <p class="kicker">Cutaway House · oxblood lock</p>
    <h1>Teal door, viewer’s left of center.</h1>
  </header>
  <div class="stage">
    <svg viewBox="0 0 400 220" class="plan" role="img" aria-label="Floor plan">
      <rect x="20" y="20" width="360" height="180" fill="none" stroke="#d7c4a0" />
      <rect id="kitchen" class="room" x="20" y="20" width="160" height="180" data-room="kitchen" />
      <rect id="stair" class="room" x="180" y="20" width="80" height="180" data-room="front" />
      <rect id="parlour" class="room" x="260" y="20" width="120" height="180" data-room="front" />
      <text x="100" y="110" text-anchor="middle" fill="#d7c4a0" font-size="12">Kitchen</text>
      <text x="220" y="110" text-anchor="middle" fill="#d7c4a0" font-size="12">Stair</text>
      <text x="320" y="110" text-anchor="middle" fill="#d7c4a0" font-size="12">Front</text>
    </svg>
    <figure>
      <img id="still" src="art/house.jpg" alt="House elevation">
      <video id="walk" muted playsinline></video>
      <figcaption id="cap">Elevation · overcast · chimney on the right</figcaption>
    </figure>
  </div>
  <script src="app.js"></script>
</body>
</html>
