<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Broadcast Kit — Kite FC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="stage">
    <img class="pitch" src="art/jersey.jpg" alt="Kite FC home jersey from crest lock">
    <div class="bug" id="bug">
      <img src="art/crest.jpg" alt="">
      <span class="club">KITE</span>
      <span class="score" id="score">0–0</span>
      <span class="clock" id="clock">12:04</span>
    </div>
    <div class="lt" id="lt">
      <img src="art/crest.jpg" alt="">
      <div>
        <p class="name">No. 9 · striker</p>
        <p class="meta">Home kit · coral collar · crest left chest</p>
      </div>
    </div>
    <div class="end" id="end" hidden>
      <img src="art/crest.jpg" alt="">
      <p>KITE FC</p>
    </div>
  </div>
  <div class="desk">
    <button type="button" id="home">Home +1</button>
    <button type="button" id="away">Away +1</button>
    <button type="button" id="wipe">Replay wipe</button>
    <button type="button" id="card">End card</button>
  </div>
  <script src="app.js"></script>
</body>
</html>
